<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img" aria-labelledby="title desc"><title id="title">学习校准台：前五分钟操作分镜</title><desc id="desc">插卡核对，调准当前样本，换卡看到连带误差，再比较同一答案下两组模型的整组表现。</desc><metadata>数值由教学样例.json及动作数值校验.json计算。此图是设计分镜，不是运行课程截图。</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7a8a98"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect width="1800" height="1140" fill="#f4f2ec"/>
