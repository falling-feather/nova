<text x="55" y="883" font-size="30" font-weight="bold" fill="#284d59" text-anchor="start">条件和目标怎样影响路线？</text>
<text x="1120" y="883" font-size="23" font-weight="normal" fill="#667872" text-anchor="start">每个对比都从上方初始地图重新开始</text>
