<text x="415" y="1080" font-size="21" font-weight="bold" fill="#284d59" text-anchor="start">最短与最省可以不同</text>
<rect x="735" y="914" width="326" height="212" rx="19" fill="#f4e9d4" stroke="#d7dbce"/>
<text x="755" y="955" font-size="25" font-weight="bold" fill="#284d59" text-anchor="start">上路改成1＋1</text>
<text x="755" y="1000" font-size="21" font-weight="normal" fill="#284d59" text-anchor="start">预算6点，少走几步</text>
<text x="755" y="1040" font-size="21" font-weight="normal" fill="#284d59" text-anchor="start">选A：2步，2点</text>
<text x="755" y="1080" font-size="21" font-weight="bold" fill="#284d59" text-anchor="start">改代价，结果也会变</text>
