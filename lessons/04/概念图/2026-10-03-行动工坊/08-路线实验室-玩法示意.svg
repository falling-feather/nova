<text x="75" y="1040" font-size="21" font-weight="normal" fill="#284d59" text-anchor="start">选A：2步，8点</text>
<text x="75" y="1080" font-size="21" font-weight="bold" fill="#284d59" text-anchor="start">B也可用：4步，4点</text>
