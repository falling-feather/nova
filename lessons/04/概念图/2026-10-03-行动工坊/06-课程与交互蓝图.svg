<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1000" viewBox="0 0 2400 1000">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#446f75"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#254952}.small{font-size:23px}.note{font-size:20px;fill:#687d7a}</style>
<rect width="2400" height="1000" fill="#f7f8ef"/>
<text x="55" y="62" font-size="42" font-weight="bold">第四章 · 课程与交互蓝图</text>
<text x="55" y="104" class="small">小学模块收尾：把认识与核对的信息，转化为明确目标、规则和经过检验的行动方案。</text>
<g><rect x="55" y="155" width="440" height="300" rx="18" fill="#e6eee7"/><text x="77" y="197" font-size="25" font-weight="bold">第1课 · 约25分钟</text><text x="77" y="239" font-size="26" font-weight="bold">大家需要什么帮助</text><text x="77" y="295" class="small">• 补齐任务信息</text><text x="77" y="340" class="small">• 明确完成条件</text><text x="77" y="385" class="small">• 选择必要工具</text></g><g><rect x="513" y="155" width="440" height="300" rx="18" fill="#e0eff1"/><text x="535" y="197" font-size="25" font-weight="bold">第2课 · 约30分钟</text><text x="535" y="239" font-size="26" font-weight="bold">把事情排成步骤</text><text x="535" y="295" class="small">• 排列图形步骤</text><text x="535" y="340" class="small">• 预测执行结果</text><text x="535" y="385" class="small">• 单步检查与修改</text></g><g><rect x="971" y="155" width="440" height="300" rx="18" fill="#f3e5cc"/><text x="993" y="197" font-size="25" font-weight="bold">第3课 · 约35分钟</text><text x="993" y="239" font-size="26" font-weight="bold">给行动加上规则与约束</text><text x="993" y="295" class="small">• 设置必要条件</text><text x="993" y="340" class="small">• 区分个人偏好</text><text x="993" y="385" class="small">• 未知或冲突时求助</text></g><g><rect x="1429" y="155" width="440" height="300" rx="18" fill="#e3ecdb"/><text x="1451" y="197" font-size="25" font-weight="bold">第4课 · 约30分钟</text><text x="1451" y="239" font-size="26" font-weight="bold">选择合适的走法</text><text x="1451" y="295" class="small">• 编辑道路代价与预算</text><text x="1451" y="340" class="small">• 比较目标与环境变化</text><text x="1451" y="385" class="small">• 重试并解释取舍</text></g><g><rect x="1887" y="155" width="440" height="300" rx="18" fill="#efe5df"/><text x="1909" y="197" font-size="25" font-weight="bold">第5课 · 约30分钟</text><text x="1909" y="239" font-size="26" font-weight="bold">我的校园小方案</text><text x="1909" y="295" class="small">• 选择具体需求</text><text x="1909" y="340" class="small">• 常规与变化都检验</text><text x="1909" y="385" class="small">• 保存自己的方案</text></g>
<text x="55" y="507" font-size="28" font-weight="bold">同一棋盘、同一方案的持续试验</text>
<path d="M310 557H2085" stroke="#446f75" stroke-width="4" fill="none" marker-end="url(#arr)"/>
<rect x="135" y="533" width="320" height="65" rx="13" fill="#fff" stroke="#c2d2ce"/><text x="295" y="576" font-size="27" text-anchor="middle">定目标</text><rect x="567" y="533" width="320" height="65" rx="13" fill="#fff" stroke="#c2d2ce"/><text x="727" y="576" font-size="27" text-anchor="middle">排步骤／加规则</text><rect x="999" y="533" width="320" height="65" rx="13" fill="#fff" stroke="#c2d2ce"/><text x="1159" y="576" font-size="27" text-anchor="middle">找可行方案</text><rect x="1431" y="533" width="320" height="65" rx="13" fill="#fff" stroke="#c2d2ce"/><text x="1591" y="576" font-size="27" text-anchor="middle">试运行</text><rect x="1863" y="533" width="320" height="65" rx="13" fill="#fff" stroke="#c2d2ce"/><text x="2023" y="576" font-size="27" text-anchor="middle">看结果</text>
<path d="M2024 606V650H483V606" fill="none" stroke="#b58c67" stroke-width="4" marker-end="url(#arr)"/><rect x="900" y="629" width="589" height="43" rx="11" fill="#f7f8ef"/><text x="1194" y="658" class="small" text-anchor="middle">发现新情况 → 修改安排或补信息 → 再试</text>
<text x="55" y="731" font-size="28" font-weight="bold">前三章的经历在个人作品中汇合</text>
<rect x="55" y="768" width="556" height="84" rx="14" fill="#fff" stroke="#d2dcd3"/><text x="333" y="818" font-size="24" text-anchor="middle">第一章｜用途、工具选择与共创</text><rect x="629" y="768" width="556" height="84" rx="14" fill="#fff" stroke="#d2dcd3"/><text x="907" y="818" font-size="24" text-anchor="middle">第二章｜证据、方法与局限</text><rect x="1203" y="768" width="556" height="84" rx="14" fill="#fff" stroke="#d2dcd3"/><text x="1481" y="818" font-size="24" text-anchor="middle">第三章｜信息、标签与核对</text><rect x="1777" y="768" width="556" height="84" rx="14" fill="#fff" stroke="#d2dcd3"/><text x="2055" y="818" font-size="24" text-anchor="middle">第四章｜目标、约束与行动</text>
<text x="55" y="909" class="small">预期成果：任务卡＋步骤和规则＋两次实际检验＋自己的说明；不要求背算法名或参数。</text>
<text x="55" y="949" class="note">五课、25个操作环节，约150分钟容量，其中约120分钟动手。以上为设计预算，尚未实现游戏或完成试教。</text>
<text x="55" y="980" class="note">行动工坊为暂用名。图形指令表达人的安排；规划建议与执行结果需要分别说明、真实检查。</text>
</svg>

