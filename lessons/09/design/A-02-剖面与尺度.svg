<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a18a5d"/></marker><pattern id="stone" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M0 0H42V42" fill="none" stroke="#dcd7c8" stroke-width=".65"/></pattern></defs><rect width="1500" height="1050" fill="#f8f5ec"/><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#284a46}.title{font-family:'SimSun',serif;font-size:36px}.small{font-size:14px;fill:#6c776c}.label{font-size:18px}.dim{stroke:#a18a5d;stroke-width:1.2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}</style><text x="48" y="50" class="small">NOVA / 奇点 第九章 · 空间参数原件驱动</text><text x="48" y="105" class="title">A-02 / 温室横剖面与装置尺度</text><text x="48" y="142" class="small">由南向北观察，横向为东西方向；剖面固定建筑高度与主要家具，细部用于约束模型。</text><rect x="177.49177249144918" y="650" width="745.0164550171016" height="15" fill="#c4b597"/><path d="M146.8 412 Q550 87.19999999999993 953.2 412" fill="#d9e6e040" stroke="#3b675b" stroke-width="8"/><path d="M177.49177249144918 650V412H922.5082275085508V650" fill="none" stroke="#b8b19a" stroke-width="16"/><path d="M177.49177249144918 613.6V412" stroke="#355e50" stroke-width="5"/><path d="M922.5082275085508 613.6V412" stroke="#355e50" stroke-width="5"/><rect x="401.6" y="587.84" width="296.8" height="62.160000000000004" fill="#6f9283" stroke="#b49c62" stroke-width="5"/><text x="550" y="690" text-anchor="middle" class="label">弧形接待台 / 顶面1.11m</text><path d="M95 650V249.59999999999997" class="dim"/><text x="70" y="480" class="small" transform="rotate(-90 70 480)">穹顶顶点7.15m</text><path d="M975 650V412" class="dim"/><text x="1000" y="565" class="small" transform="rotate(-90 1000 565)">檐口4.25m</text><rect x="1040" y="267" width="365" height="417" rx="18" fill="#ede9dc" stroke="#c7bca2"/><text x="1066" y="306" class="label">可编辑构造</text><text x="1066" y="348" class="small">石材柱与圆拱：实体截面与接缝</text><text x="1066" y="385" class="small">穹顶：16道径向肋 + 环向檩条</text><text x="1066" y="422" class="small">玻璃：独立面，不烘焙按钮和正文</text><text x="1066" y="459" class="small">书展柜：柜身 / 封存书 / 玻璃罩</text><text x="1066" y="496" class="small">资料柜：24个可标识抽屉</text><text x="1066" y="533" class="small">便签装置：0.98 × 0.70m</text><text x="1066" y="570" class="small">园园：0.62m，头与屏幕独立</text><text x="1066" y="607" class="small">交班桌：顶面0.82m</text><text x="100" y="790" class="label">镜头与内容分开</text><text x="100" y="828" class="small">总览建立空间；接待近景保留南北主轴；书、窗口和资料柜各有独立近景。</text><text x="100" y="861" class="small">阅读面打开时保持文本正面可读；关闭回到接待位，保留当前问题与已准备材料。</text><text x="100" y="905" class="small">当前参数为独立复刻样板的建模原件。以实际截图检查尺度与遮挡，不把生图透视当作精确图纸。</text><path d="M48 996H1452" stroke="#d1c7ad"/><text x="48" y="1022" class="small">四季问询亭 · 2026-10-12　/　米制虚拟空间方案</text></svg>